name: Deploy and Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Frontend Dependencies
        working-directory: web
        run: |
          rm -f package-lock.json
          npm install

      - name: Build Frontend
        working-directory: web
        run: npm run build

      - name: Start Background Preview Server
        working-directory: web
        run: |
          npx serve out -p 5173 &
          sleep 4
          curl -s --head  --request GET http://127.0.0.1:5173/ | grep "200 OK"
          echo "TEST_BASE_URL=http://127.0.0.1:5173/" >> $GITHUB_ENV

      - name: Install E2E Dependencies
        working-directory: mandibularE2E
        run: npm ci || npm install

      - name: Run Mega Web E2E Test Suite
        working-directory: mandibularE2E
        run: npx mocha tests/mega_web_1100.test.js --reporter ./utils/excelReporter.js

      - name: Inject Reports into Build Directory
        run: |
          mkdir -p web/out/reports/latest
          mkdir -p web/out/reports/history/build-${{ github.run_number }}
          cp mandibularE2E/Test_Results/HTML/execution-report.html web/out/reports/latest/execution-report.html
          cp mandibularE2E/Test_Results/HTML/execution-report.html web/out/reports/history/build-${{ github.run_number }}/execution-report.html
          cp mandibularE2E/Test_Results/selenium-report.xlsx web/out/reports/latest/selenium-report.xlsx

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write Step Summary
        if: always()
        run: |
          echo "### 🚀 Mega Web E2E Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ 1,100 Tests Executed across 110 Categories." >> $GITHUB_STEP_SUMMARY
          echo "📊 [View HTML Execution Report](${{ steps.deployment.outputs.page_url }}reports/latest/execution-report.html)" >> $GITHUB_STEP_SUMMARY
          echo "📂 History reports saved to \`/reports/history/build-${{ github.run_number }}/\`" >> $GITHUB_STEP_SUMMARY
